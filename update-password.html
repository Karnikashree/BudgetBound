<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Update Password - BudgetBound</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 3 -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="css/individual-login.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbarNav"
                    aria-expanded="false">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="index.html">BudgetBound</a>
            </div>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="index.html"><i class="fa fa-home"></i> Home</a></li>
                    <li><a href="about.html"><i class="fa fa-info-circle"></i> About Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fa fa-key"></i>
                <h2>Update Password</h2>
                <p>Enter your new password below</p>
            </div>

            <div class="login-body">
                <form id="updatePasswordForm">
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <div class="input-with-icon">
                            <i class="fa fa-lock input-icon"></i>
                            <input type="password" id="newPassword" class="form-control" placeholder="New Password"
                                required>
                            <button type="button" class="password-toggle" id="toggleNewPassword">
                                <i class="fa fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message" id="newPasswordError"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-with-icon">
                            <i class="fa fa-lock input-icon"></i>
                            <input type="password" id="confirmPassword" class="form-control"
                                placeholder="Confirm Password" required>
                            <button type="button" class="password-toggle" id="toggleConfirmPassword">
                                <i class="fa fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message" id="confirmPasswordError"></div>
                    </div>

                    <!-- Make password strength visible/styled if needed, or keep hidden initially -->
                    <div class="password-strength" id="passwordStrength"
                        style="display:none; margin-bottom:15px; font-size:12px; color:#666;"></div>

                    <div class="loader" id="formLoader">
                        <div class="loader-spinner"></div>
                        <p>Updating password...</p>
                    </div>

                    <button type="submit" class="btn btn-login" id="updateBtn">
                        <i class="fa fa-refresh"></i> Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Toast Template -->
    <div id="toast-template" style="display: none;">
        <div class="toast">
            <span class="toast-icon"></span>
            <span class="toast-body"></span>
            <button class="btn-close">&times;</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <!-- Custom Logic -->
    <script src="js/update-password.js"></script>
</body>

</html>
