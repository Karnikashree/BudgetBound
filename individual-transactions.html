<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Transactions - BudgetBound</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container-fluid">
            <div class="navbar-header">
                <a href="individual-dashboard.html" class="navbar-brand">BudgetBound</a>
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbarNav">
                    <span class="icon-bar"></span> <span class="icon-bar"></span> <span class="icon-bar"></span>
                </button>
            </div>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="individual-dashboard.html"><i class="fa fa-dashboard"></i> Dashboard</a></li>
                    <li><a href="individual-sectors.html"><i class="fa fa-folder-open"></i> Sectors</a></li>
                    <li><a href="individual-history.html"><i class="fa fa-history"></i> History</a></li>
                    <li><a href="individual-profile.html"><i class="fa fa-users"></i> Profile</a></li>
                    <li><a href="index.html" id="logoutBtn"><i class="fa fa-sign-out"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container dashboard-container">
        <div class="row">
            <div class="col-md-12">
                <div class="panel panel-default">
                    <div class="panel-heading" style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 class="panel-title"><i class="fa fa-list"></i> All Transactions</h3>
                        <button class="btn btn-success btn-sm" data-toggle="modal" data-target="#addTransactionModal">
                            <i class="fa fa-plus"></i> Add New
                        </button>
                    </div>
                    <div class="panel-body">
                        <!-- Filters -->
                        <div class="row" style="margin-bottom: 20px;">
                            <div class="col-md-3">
                                <label>Type</label>
                                <select id="filterType" class="form-control">
                                    <option value="all">All</option>
                                    <option value="expense">Expense</option>
                                    <option value="income">Income</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label>Category</label>
                                <select id="filterCategory" class="form-control">
                                    <option value="all">All Categories</option>
                                    <option value="Food">Food</option>
                                    <option value="Transport">Transport</option>
                                    <option value="Utilities">Utilities</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Health">Health</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label>Sort By</label>
                                <select id="sortBy" class="form-control">
                                    <option value="date-desc">Newest First</option>
                                    <option value="date-asc">Oldest First</option>
                                    <option value="amount-desc">Highest Amount</option>
                                    <option value="amount-asc">Lowest Amount</option>
                                </select>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover table-striped">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Category</th>
                                        <th>Description</th>
                                        <th>Type</th>
                                        <th class="text-right">Amount</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="transactionsList">
                                    <tr>
                                        <td colspan="6" class="text-center">Loading...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Transaction Modal (Same as Dashboard) -->
    <div class="modal fade" id="addTransactionModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                    <h4 class="modal-title">Add New Transaction</h4>
                </div>
                <div class="modal-body">
                    <form id="addTransactionForm">
                        <div class="form-group">
                            <label>Type</label>
                            <div class="btn-group btn-group-justified" data-toggle="buttons">
                                <label class="btn btn-default active" id="typeExpenseBtn"><input type="radio"
                                        name="type" value="expense" checked> Expense</label>
                                <label class="btn btn-default" id="typeIncomeBtn"><input type="radio" name="type"
                                        value="income"> Income</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Amount (₹)</label>
                            <input type="number" class="form-control" id="amount" placeholder="0.00" required
                                step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select class="form-control" id="category" required>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Health">Health</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" class="form-control" id="date" required>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <input type="text" class="form-control" id="description">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="saveTransactionBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <!-- Reusing logic but simpler to make a dedicated script for filters -->
    <script src="js/individual-transactions.js"></script>
</body>

</html>
