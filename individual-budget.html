<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Budget - BudgetBound</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/individual-budget.css">
</head>

<body>

    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container-fluid">
            <div class="navbar-header">
                <a href="individual-dashboard.html" class="navbar-brand">BudgetBound</a>
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbarNav">
                    <span class="icon-bar"></span> <span class="icon-bar"></span> <span class="icon-bar"></span>
                </button>
            </div>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="individual-dashboard.html"><i class="fa fa-dashboard"></i> Dashboard</a></li>
                    <li><a href="individual-sectors.html"><i class="fa fa-folder-open"></i> Sectors</a></li>
                    <li><a href="individual-history.html"><i class="fa fa-history"></i> History</a></li>
                    <li><a href="individual-profile.html"><i class="fa fa-users"></i> Profile</a></li>
                    <li><a href="index.html" id="logoutBtn"><i class="fa fa-sign-out"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container dashboard-container">
        <div class="row">
            <div class="col-md-12 text-center">
                <h2 class="welcome-text" id="pageTitle">Personal Budget Manager</h2>
            </div>
        </div>

        <!-- 1. SUMMARY CARDS -->
        <div class="row summary-cards">
            <div class="col-md-4 col-sm-6">
                <!-- Card implementation -->
                <div class="summary-card income-card">
                    <div class="card-body">
                        <div class="card-icon"><i class="fa fa-arrow-down"></i></div>
                        <div class="card-info">
                            <h3>Total Income</h3>
                            <p class="amount text-success">₹<span id="budgetTotalIncome">0.00</span></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-sm-6">
                <div class="summary-card expense-card">
                    <div class="card-body">
                        <div class="card-icon"><i class="fa fa-shopping-cart"></i></div>
                        <div class="card-info">
                            <h3>Total Expense</h3>
                            <p class="amount text-danger">₹<span id="budgetTotalExpense">0.00</span></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-sm-12">
                <div class="summary-card balance-card">
                    <div class="card-body">
                        <div class="card-icon"><i class="fa fa-balance-scale"></i></div>
                        <div class="card-info">
                            <h3>Balance</h3>
                            <p class="amount text-primary">₹<span id="budgetBalance">0.00</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. FORMS SIDE BY SIDE (Styled as Cards) -->
        <div class="row">
            <!-- Add Income Card -->
            <div class="col-md-6">
                <div class="form-card">
                    <div class="form-header income-header">
                        <i class="fa fa-plus-circle"></i> Add Income
                    </div>
                    <div class="form-body">
                        <form id="budgetIncomeForm">
                            <input type="hidden" name="type" value="income">
                            <div class="form-group">
                                <label>Amount (₹)</label>
                                <input type="number" class="form-control" id="incomeAmount" required step="0.01">
                            </div>
                            <div class="form-group">
                                <label>Sector (Fixed)</label>
                                <input type="text" class="form-control" id="incomeSectorFixed" readonly
                                    style="background-color:#eee;">
                            </div>
                            <div class="form-group">
                                <label>Source</label>
                                <input type="text" class="form-control" id="incomeSourceInput"
                                    placeholder="e.g. Salary, Bonus, Freelance">
                            </div>
                            <div class="form-group">
                                <label>Date</label>
                                <input type="date" class="form-control" id="incomeDate" required>
                            </div>
                            <div class="form-group">
                                <label>Description</label>
                                <input type="text" class="form-control" id="incomeDescription"
                                    placeholder="e.g. Monthly Salary">
                            </div>
                            <button type="submit" class="btn-form-submit btn-income">Add Income</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Add Expense Card -->
            <div class="col-md-6">
                <div class="form-card">
                    <div class="form-header expense-header">
                        <i class="fa fa-minus-circle"></i> Add Expense
                    </div>
                    <div class="form-body">
                        <form id="budgetExpenseForm">
                            <input type="hidden" name="type" value="expense">
                            <div class="form-group">
                                <label>Amount (₹)</label>
                                <input type="number" class="form-control" id="expenseAmount" required step="0.01">
                            </div>
                            <div class="form-group">
                                <label>Sector (Fixed)</label>
                                <input type="text" class="form-control" id="expenseSectorFixed" readonly
                                    style="background-color:#eee;">
                            </div>
                            <div class="form-group">
                                <label>Item / Purpose</label>
                                <input type="text" class="form-control" id="expenseSourceInput"
                                    placeholder="e.g. Rent, Groceries, Fuel">
                            </div>
                            <div class="form-group">
                                <label>Date</label>
                                <input type="date" class="form-control" id="expenseDate" required>
                            </div>
                            <div class="form-group">
                                <label>Description</label>
                                <input type="text" class="form-control" id="expenseDescription"
                                    placeholder="e.g. Weekly Groceries">
                            </div>
                            <button type="submit" class="btn-form-submit btn-expense">Add Expense</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. TRANSACTION LIST CARD -->
        <div class="row">
            <div class="col-md-12">
                <div class="entries-card">
                    <div class="entries-header">
                        <i class="fa fa-list-alt"></i> Recent Budget Entries
                    </div>
                    <div class="entries-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Category</th>
                                        <th>Description</th>
                                        <th>Type</th>
                                        <th class="text-right">Amount</th>
                                    </tr>
                                </thead>
                                <tbody id="budgetTransactionsList">
                                    <tr>
                                        <td colspan="5" class="text-center">Loading...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/individual-budget.js"></script>

</body>

</html>
